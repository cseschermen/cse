    platteLijst.push({ naam: leerling, klas: k.klas });
  });
});

const START_DATUM = new Date("2026-08-31T00:00:00");

function getDatumDetails() {
  const params = new URLSearchParams(window.location.search);
  let datum = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Amsterdam" }));

  const override = params.get("datum");
  if (override) {
    return { datum: new Date(override + "T00:00:00"), isMorgen: params.get("morgen") === "true" };
  }

  const isMorgen = params.get("morgen") === "true";
  if (isMorgen) {
    datum.setDate(datum.getDate() + 1);
  }

  return { datum, isMorgen };
}

function berekenSchooldagenVanafStart(doelDatum) {
  let teller = 0;
  let cursor = new Date(START_DATUM.getTime());
  
  cursor.setHours(0,0,0,0);
  const target = new Date(doelDatum.getTime());
  target.setHours(0,0,0,0);

  while (cursor < target) {
    const dag = cursor.getDay();
    if (dag !== 0 && dag !== 6) { // Geen weekend
      teller++;
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  return teller;
}

function formatteerDatum(datum) {
  return new Intl.DateTimeFormat("nl-NL", {
    weekday: "long",
    day: "numeric",
    month: "long"
  }).format(datum);
}

function update() {
  const { datum, isMorgen } = getDatumDetails();
  let dag = datum.getDay();

  // Weekend afhandeling: schuif door naar maandag
  if (dag === 6) datum.setDate(datum.getDate() + 2);
  if (dag === 0) datum.setDate(datum.getDate() + 1);

  const schooldagenGeweest = berekenSchooldagenVanafStart(datum);
  
  const startIndex = (schooldagenGeweest * 5) % platteLijst.length;
  const dagSelectie = [];

  for (let i = 0; i < 5; i++) {
    const index = (startIndex + i) % platteLijst.length;
    dagSelectie.push(platteLijst[index]);
  }

  // Toont "Corvee vandaag - [datum]" of "Corvee morgen - [datum]"
  const label = isMorgen ? "Corvee morgen" : "Corvee vandaag";
  document.getElementById("titel-header").textContent = label + " - " + formatteerDatum(datum);

  const container = document.getElementById("klassen");
  container.innerHTML = "";

  dagSelectie.forEach(item => {
    const div = document.createElement("div");
    div.className = "klas";
    div.innerHTML = `
      <span class="klas-naam">${item.naam}</span>
      <span class="klas-label">${item.klas}</span>
    `;
    container.appendChild(div);
  });
}

update();
setInterval(update, 5 * 60 * 1000);
